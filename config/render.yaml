services:   
  - type: web     
    name: Mytodolist-ror 
    runtime: ruby     
    plan: free
    buildCommand: bundle install 
    startCommand: bin/dev     
    healthCheckPath: /up     
    disk:       
      name: rails-storage       
      mountPath: /rails/storage       
      sizeGB: 1     
    envVars:       
      - key: RAILS_MASTER_KEY         
        sync: false